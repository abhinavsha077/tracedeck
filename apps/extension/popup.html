<!doctype html><html><head><meta charset="utf-8"><style>
:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark}body{width:310px;margin:0;background:#08131d;color:#eff7ff}.wrap{padding:14px}.brand{display:flex;gap:9px;align-items:center;margin-bottom:14px}.logo{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:linear-gradient(140deg,#6ee7f2,#62a8ff);color:#06111a;font-weight:900}.brand b{display:block}.brand span{font-size:10px;color:#8da7bd}.card{border:1px solid #21394d;background:#0d1c28;border-radius:10px;padding:11px;margin-top:8px}.btn{width:100%;height:38px;border:1px solid #2d4a62;border-radius:8px;background:#112536;color:#eef8ff;font-weight:700;cursor:pointer;margin-top:8px}.btn.primary{background:#287dde;border-color:#4e9cff}.btn.danger{border-color:#6b3341;color:#ff9aa7}.btn.warning{background:#8a5814;border-color:#d48b26;color:#fff}.btn.warning:hover{filter:brightness(1.15)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.status{font-size:11px;color:#8da7bd;line-height:1.45}.ok{color:#6ee0a4}.row{display:flex;justify-content:space-between;align-items:center}.link{border:0;background:none;color:#81bfff;font-size:11px;cursor:pointer;padding:0}.recording{width:7px;height:7px;background:#ff6575;border-radius:50%;display:inline-block;margin-right:5px;box-shadow:0 0 8px #ff6575}.label{font-size:10px;color:#8da7bd;text-transform:uppercase;letter-spacing:.08em}.badge-status{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:.06em;display:inline-block}.badge-status.ready{background:#142535;color:#8da7bd}.badge-status.live{background:#581d28;color:#ff8b99}.badge-status.paused{background:#4d3c12;color:#ffd166}.timer{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:700;color:#6ee7f2}
</style></head><body><div class="wrap"><div class="brand"><div class="logo">T</div><div><b>TraceDeck</b><span>Debugging evidence</span></div></div><div class="card"><div class="row"><span class="label">Connection</span><button class="link" id="options">Settings</button></div><div id="server" class="status">Checking…</div></div><div class="card"><div class="row" style="margin-bottom:6px"><div id="record-state" class="status"><span class="badge-status ready">Ready</span> Ready to capture</div><div id="record-timer" class="timer mono" style="display:none">00:00</div></div><button class="btn primary" id="record">Start tab recording</button><button class="btn warning" id="pause" style="display:none">Pause</button><div class="grid"><button class="btn" id="screenshot">Screenshot</button><button class="btn" id="fullpage">Full page</button></div><div class="grid"><button class="btn" id="desktop">Screen / window</button><button class="btn" id="replay">Save last 2 min</button></div></div><div id="result" class="status" style="margin-top:10px"></div></div><script src="popup.js"></script></body></html>
