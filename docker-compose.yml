services:
  tracedeck:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "4177:4177"
    environment:
      TRACEDECK_HOST: 0.0.0.0
      TRACEDECK_PORT: 4177
      TRACEDECK_PUBLIC_URL: ${TRACEDECK_PUBLIC_URL:-http://localhost:4177}
      TRACEDECK_SIGNING_SECRET: ${TRACEDECK_SIGNING_SECRET:-replace-this}
      TRACEDECK_AI_BASE_URL: ${TRACEDECK_AI_BASE_URL:-}
      TRACEDECK_AI_API_KEY: ${TRACEDECK_AI_API_KEY:-}
      TRACEDECK_AI_MODEL: ${TRACEDECK_AI_MODEL:-}
      TRACEDECK_GITHUB_TOKEN: ${TRACEDECK_GITHUB_TOKEN:-}
      TRACEDECK_GITHUB_REPO: ${TRACEDECK_GITHUB_REPO:-}
      TRACEDECK_LINEAR_TOKEN: ${TRACEDECK_LINEAR_TOKEN:-}
      TRACEDECK_JIRA_BASE_URL: ${TRACEDECK_JIRA_BASE_URL:-}
      TRACEDECK_JIRA_EMAIL: ${TRACEDECK_JIRA_EMAIL:-}
      TRACEDECK_JIRA_TOKEN: ${TRACEDECK_JIRA_TOKEN:-}
      TRACEDECK_SLACK_WEBHOOK_URL: ${TRACEDECK_SLACK_WEBHOOK_URL:-}
    volumes:
      - tracedeck_data:/var/lib/tracedeck
    restart: unless-stopped
volumes:
  tracedeck_data:
